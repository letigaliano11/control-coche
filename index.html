:root{--m:#64748b;--bg:#f3f6f4;--card:#fff;--tx:#14201a;--mu:#6b7a72;--ln:#e3e9e5;--pr:#16a34a;--g:#a855f7;--t:#0ea5e9;--r:#f97316}
*{box-sizing:border-box;margin:0}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:#1f3f1b;z-index:99}
body{font:15px/1.4 Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#e3f5e8,#f6faf7 40%,#fff);min-height:100vh;color:var(--tx);padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 28px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
main{max-width:480px;margin:auto;padding:16px;display:grid;gap:14px}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.04)}
header{display:flex;align-items:center;justify-content:space-between}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px}h1 span{color:var(--pr)}
.ib{width:38px;height:38px;border-radius:12px;background:var(--card);display:grid;place-items:center;font-size:18px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
#mes::first-letter,.ttl h2::first-letter,.pan h2::first-letter{text-transform:uppercase}
#mes{font-weight:700;font-size:17px;cursor:pointer;background:var(--pr);color:#fff;padding:8px 20px;border-radius:99px}
.wd,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{font-size:11px;font-weight:600;color:var(--mu);text-align:center;margin-bottom:4px}
.d{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600;font-size:14px;background:#e8f7ec}
.d.out{opacity:.35;background:none}.d.today{outline:2px solid var(--pr);outline-offset:-2px}
.d.sel{background:var(--pr);color:#fff}
.d i{display:flex;gap:3px;height:6px}
.d b{width:6px;height:6px;border-radius:50%}
.g{--c:var(--g)}.t{--c:var(--t)}.r{--c:var(--r)}
.d b.g{background:var(--g)}.d b.m{background:var(--m)}.d b.t{background:var(--t)}.d b.r{background:var(--r)}
.d.sel b{box-shadow:0 0 0 1.5px #fff}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.chip{background:var(--bg);border-radius:14px;padding:10px;text-align:center}
.chip b{display:block;font-size:17px;font-weight:700}.chip small,.k small{color:var(--mu);font-size:12px}
.ttl{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ttl h2{font-size:16px;font-weight:700}
.btn{background:var(--pr);color:#fff;font-weight:600;padding:8px 14px;border-radius:12px}
.ev{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}
.ev:first-of-type{border-top:0}
.ico{color:var(--c);width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);flex:none}
.ev div:last-child{min-width:0}.ev b{display:block;font-weight:600}.ev small{color:var(--mu)}
.empty{color:var(--mu);padding:6px 0}
.big{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px}
.big b{font-size:30px;font-weight:800;letter-spacing:-1px}.big small{display:block;color:var(--mu);font-size:12px}
.gauge{height:14px;border-radius:99px;background:var(--ln);overflow:hidden}
.boxes{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:10px}.boxes i{height:18px;border-radius:5px}.bxl{display:block;margin-top:6px;color:var(--mu);font-size:12px;text-align:right}
.gauge i{display:block;height:100%;border-radius:99px;transition:width .5s,background .3s}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.k{background:var(--bg);border-radius:14px;padding:10px 12px}.k b{display:block;font-size:16px;font-weight:700}
.car{padding:14px 6px 4px;overflow:hidden;background:linear-gradient(180deg,#f1faf4,#fff)}.car svg{width:100%;max-width:400px;margin:0 auto;display:block}.wh{transform-box:fill-box;transform-origin:center;animation:spin .9s ease-out}.car small{display:block;text-align:center;color:var(--tx);font:400 23px/1.15 "Lilita One","Trebuchet MS",Verdana,sans-serif;letter-spacing:.4px;margin:4px 0 8px}
.lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:lid var(--blink,4.5s) infinite}@keyframes lid{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1.05)}}
@keyframes drive{from{transform:translateX(-60px);opacity:0}}@keyframes spin{from{transform:rotate(-540deg)}}
#car-svg{transform-origin:50% 100%}
#cnight{opacity:0;transition:opacity .6s}.hl-on,.halo{opacity:0;transition:opacity .6s}.eh{opacity:0;transition:opacity .6s}
.night #cnight{opacity:.32}.night .hl-on,.night .halo{opacity:1}.night .iris{fill:#38bdf8}
body.night{--bg:#1a2620;--card:#15201a;--tx:#e6efe9;--mu:#93a49b;--ln:#2a3832;--pr:#1fa355;color-scheme:dark;background:linear-gradient(180deg,#09120d,#0d1812 40%,#101b15)}
.night body::before,body.night::before{background:#09120d}
.night .d{background:#1d3628}.night .d.sel{background:var(--pr)}
.night .car{background:linear-gradient(180deg,#0b1610,#122219)}
.night .it{background:#1b2721}.night .it input:focus{background:var(--card)}
.night .est.ok{background:#14532d;color:#bbf7d0}.night .est.no{background:#7c2d12;color:#fed7aa}
.night .al{background:color-mix(in srgb,var(--c) 24%,var(--card))}
.night .add{background:color-mix(in srgb,var(--c) 22%,var(--card))}
.night .bar{background:linear-gradient(180deg,rgba(21,32,26,0),var(--card) 28%)}
.night .tg input{background:#3a4a43}.night .tg input:checked{background:var(--c)}
.night .ib,.night .cx{box-shadow:none}
#car-svg.nod{animation:nod 5s ease-in-out infinite}
#car-svg.sleep{animation:sleep 4s ease-in-out infinite}
@keyframes nod{0%,45%{transform:rotate(0)}65%,72%{transform:rotate(2.6deg) translateY(2px)}80%{transform:rotate(-1deg)}90%,100%{transform:rotate(0)}}
@keyframes sleep{0%,100%{transform:rotate(1.8deg) translateY(1px)}50%{transform:rotate(1.8deg) scale(1.012)}}
#yawn{transform-box:fill-box;transform-origin:50% 40%;opacity:0;pointer-events:none}
#car-svg.yawning #yawn{animation:yawn 4.5s ease-in-out infinite}
#car-svg.snoring #yawn{opacity:1;animation:snore 3.2s ease-in-out infinite}
@keyframes yawn{0%,28%{transform:scale(.08);opacity:0}38%{opacity:1}46%,74%{transform:scale(1);opacity:1}86%{opacity:1}94%,100%{transform:scale(.08);opacity:0}}
@keyframes snore{0%,100%{transform:scale(.35)}50%{transform:scale(.55)}}
#car-svg.yawning .lid{animation:lidyawn 4.5s ease-in-out infinite}
@keyframes lidyawn{0%,24%{transform:scaleY(0)}36%,78%{transform:scaleY(1.05)}90%,100%{transform:scaleY(0)}}
#ask{transform-box:fill-box;transform-origin:80% 100%;animation:ask 1.4s ease-in-out infinite}
@keyframes ask{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
#sheet.open{display:flex}
.pan{background:var(--card);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.pan h2{font-size:18px}
.blk{background:var(--bg);border-radius:16px;padding:12px;margin-top:12px;border-left:4px solid var(--c)}
.blk h3{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:6px}
.blk h3 button{color:var(--c);font-weight:600;font-size:13px}
.sw{display:flex;gap:10px;align-items:center;font-weight:600}.sw input{width:20px;height:20px;accent-color:var(--g)}
.row{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-top:6px}
.row.rc{grid-template-columns:1fr 1fr 1fr auto}.row .w{grid-column:1/-1}
select,input[type=date],input[type=text],input:not([type]),input[inputmode]{font:inherit;color:inherit;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
#mant summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:700}
#mant summary::-webkit-details-marker{display:none}
#mant summary::after{content:"›";font-size:24px;line-height:1;color:var(--mu);transition:transform .2s}
#mant[open] summary::after{transform:rotate(90deg)}
#mant[open] summary{margin-bottom:12px}
.bt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bt .btn{padding:8px 14px}
.blk>input,.blk>select{margin-top:8px}.lb{display:block;margin-top:10px;font-size:13px;color:var(--mu)}.m{--c:var(--m)}
.cred{font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:1.4;color:var(--mu);text-align:right;max-width:62%;cursor:pointer}
.sub{font:700 12px Arial,Helvetica,sans-serif;margin-top:2px}
.est{font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;width:fit-content}.est:empty{display:none}.est.ok{background:#dcfce7;color:#166534}.est.no{background:#ffedd5;color:#c2410c}
#alerts{display:grid;gap:8px}#alerts:empty{display:none}.al{background:color-mix(in srgb,var(--c) 13%,#fff);border-left:5px solid var(--c);border-radius:16px;padding:12px 14px}.al b{display:block}.al small{color:var(--mu)}
.x{color:var(--mu);padding:0 6px}
.sec{background:var(--bg);border-radius:20px;padding:14px;margin-top:12px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:10px}.sh h3{flex:1;font-size:15px}
.add{background:color-mix(in srgb,var(--c) 15%,#fff);color:var(--c);font-weight:700;font-size:13px;padding:7px 12px;border-radius:99px}
.it{background:#fff;border-radius:16px;padding:12px;margin-top:8px;display:grid;gap:10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.ih{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mu)}
.x2{width:28px;height:28px;border-radius:50%;background:var(--bg);color:var(--mu);font-size:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--mu)}
.it input{font-size:16px;padding:12px;border-radius:12px;background:var(--bg);border-color:transparent;color:var(--tx)}.it input:focus{outline:2px solid var(--c);background:#fff}
.tg{display:flex;align-items:center;gap:12px;font-weight:600;cursor:pointer}
.tg input{-webkit-appearance:none;appearance:none;margin:0;width:46px;height:28px;border-radius:99px;background:#cbd5d1;position:relative;flex:none;transition:background .2s;cursor:pointer}
.tg input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tg input:checked{background:var(--c)}.tg input:checked::after{transform:translateX(18px)}
.emp{color:var(--mu);font-size:13px}
.bar{position:sticky;bottom:0;display:flex;gap:10px;margin:16px -16px calc(-1*(env(safe-area-inset-bottom) + 18px));padding:14px 16px calc(env(safe-area-inset-bottom) + 18px);background:linear-gradient(180deg,rgba(255,255,255,0),#fff 28%)}
.bar button{flex:1;padding:15px;border-radius:14px;font-weight:700;background:var(--bg)}.bar .btn{flex:2;background:var(--pr);font-size:16px}
.pan{--pt:18px;padding-top:var(--pt)}
#sheet.top{align-items:flex-start}#sheet.top .pan{--pt:calc(env(safe-area-inset-top) + 18px);border-radius:0 0 24px 24px;max-height:94%}
.ph{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:calc(-1*var(--pt)) -16px 8px;padding:var(--pt) 16px 10px;background:var(--card)}
.cx{width:40px;height:40px;border-radius:50%;background:var(--bg);font-size:20px;line-height:1;flex:none;color:var(--mu)}
.big-btn{display:block;width:100%;padding:16px;font-size:17px;border-radius:16px;margin-bottom:6px}
.qk{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}.qk button{background:var(--card);color:var(--c);border:1px solid var(--c);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600}
.hist summary{cursor:pointer;color:var(--mu);font-size:13px;font-weight:600;margin-top:12px}.hist .empty{font-size:13px}
.acts{display:flex;gap:10px;margin-top:16px}.acts button{flex:1;padding:12px;border-radius:14px;font-weight:600;background:var(--bg)}.acts .btn{background:var(--pr)}
#msg{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:9}
.z1,.z2{animation:zfloat 2.6s ease-in-out infinite}.z2{animation-delay:.9s}@keyframes zfloat{0%{transform:translateY(6px);opacity:0}30%{opacity:1}100%{transform:translateY(-8px);opacity:0}}
[data-go]{cursor:pointer}
#splash{position:fixed;inset:0;z-index:300;display:grid;place-items:center;pointer-events:none;background:radial-gradient(circle at 50% 30%,#3e8a54,#1c5a2e 45%,#0d2a14);animation:spOut .5s ease 1.1s forwards}
#splash img{width:min(42vw,190px);border-radius:22%;box-shadow:0 12px 40px rgba(0,0,0,.35);animation:spIn .6s cubic-bezier(.2,.9,.3,1.2)}
@keyframes spIn{from{transform:scale(.7);opacity:0}}@keyframes spOut{to{opacity:0;visibility:hidden}}
#park .pkn{font-size:18px;font-weight:700;margin-top:2px;overflow-wrap:anywhere}
#park .pkm{color:var(--mu);font-size:12.5px;margin-top:3px}
.pkb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.pkb .btn{display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;text-decoration:none;padding:12px 8px;border-radius:12px;font-size:14px}
.pkb .btn svg{width:18px;height:18px;flex:none}
.pkb .btn.s2{background:var(--bg);color:var(--tx)}.pkb .btn.w{grid-column:1/-1}.pkb .btn[disabled]{opacity:.6}
</style>
</head>

// Cada par de recargas "llenas" consecutivas es una medida real: km recorridos / litros repuestos.
// El consumo es la media ponderada de todas (las recientes pesan más, las largas más, se descartan atípicas)

    const m = v.map(g => g.c).sort((a, b) => a - b)[v.length >> 1];

function oil() {
  const ch = all("Taller").filter(e => e.motivo === "Cambio de aceite").sort((a, b) => b.ts - a.ts)[0];
  const pts = ch && +ch.km ? [[+ch.km, 100]] : [];
  all("Aceite").filter(e => !ch || e.ts >= ch.ts).forEach(e => { if (+e.km && e.pct !== "") pts.push([+e.km, +e.pct]); });
  const km = kmAt(Infinity);
  if (pts.length < 2) return ch && km > +ch.km ? { est: Math.max(0, 100 - 100 * (km - ch.km) / 15000), left: Math.max(0, 15000 - (km - ch.km)) * .85, aprox: true } : null;
  const n = pts.length, mx = pts.reduce((a, p) => a + p[0], 0) / n, my = pts.reduce((a, p) => a + p[1], 0) / n;
  const sxx = pts.reduce((a, p) => a + (p[0] - mx) ** 2, 0), sxy = pts.reduce((a, p) => a + (p[0] - mx) * (p[1] - my), 0);
  const rate = sxx ? -sxy / sxx : 0;           // % que baja por km
  if (rate <= 0) return null;
  const last = pts.reduce((a, b) => b[0] > a[0] ? b : a);
  const est = Math.max(0, last[1] - rate * (km - last[0]));
  return { est, left: Math.max(0, (est - 15) / rate) };
}

function renderCar() {

  ["bagL", "bagR"].forEach(i => g(i).setAttribute("opacity", ip(left, [[520, 0], [450, 1]])));
  const ey = ip(left, [[600, 152], [450, 154]]), cy = ip(left, [[600, 164], [450, 157], [200, 154]]);
  g("mouth").setAttribute("d", `M134 ${ey} Q170 ${cy} 206 ${ey}`);

// Siempre está "Ida y vuelta al trabajo"; cualquier otro trayecto que repitas más de 10 veces pasa a ser opción rápida.
// Al pulsarla se añade con su comentario y los km estimados según la distancia habitual de ese trayecto.
const QUICK_SEED = ["Ida y vuelta al trabajo"], QUICK_N = 10, nk = x => String(x ?? "").trim().toLowerCase();
function quick() {
  const tr = all("Trayectos").sort((a, b) => a.km - b.km), ms = new Map();
  QUICK_SEED.forEach(l => ms.set(nk(l), { label: l, n: 0, d: [] }));
  tr.forEach((e, i) => {
    const c = clean(e.coment), k = nk(c); if (!k) return;
    if (!ms.has(k)) ms.set(k, { label: c.trim(), n: 0, d: [] });
    const q = ms.get(k); q.n++;
    let j = i - 1; while (j >= 0 && +tr[j].km >= +e.km) j--;
    if (j >= 0) q.d.push(e.km - tr[j].km);
  });
  const med = a => { const v = a.filter(x => x > 0).sort((x, y) => x - y); return v.length ? v[v.length >> 1] : 0; };
  return [...ms.values()].filter(q => q.n > QUICK_N || QUICK_SEED.some(l => nk(l) === nk(q.label))).sort((a, b) => b.n - a.n).slice(0, 6).map(q => ({ label: q.label, d: med(q.d) }));
}

    </div>
    ${gps ? `<div class="pkb" style="margin-top:8px"><button class="btn s2 w" id="pk-new" style="padding:10px;font-size:13px">He aparcado en otro sitio · guardar GPS de nuevo</button></div>` : ""}`;
}
setInterval(() => { if (!busy) renderPark(); }, 60000);

async function guardarGps(keep) {
  if (busy) return; busy = true; pd = ""; renderPark();
  try {
    const c = await getPos(), old = keep ? pkVal() : null, now = Date.now();
    const nube = await putPark({ ts: keep && old?.ts ? old.ts : now, lat: +c.latitude.toFixed(6), lng: +c.longitude.toFixed(6), acc: Math.round(c.accuracy), nota: old?.nota || "" });
    okMsg(nube, `Ubicación guardada (±${Math.round(c.accuracy)} m)`);
  } catch (e) { toast(geoErr(e)); }
  busy = false; renderPark();
}
async function distancia() {
  const v = pkVal(); if (!v || v.lat == null || busy) return;
  busy = true; renderPark();
  try {
    const c = await getPos(), d = hav(c.latitude, c.longitude, v.lat, v.lng), b = brg(c.latitude, c.longitude, v.lat, v.lng);
    pd = d < 25 ? "Estás junto al coche" : `El coche está a ${d < 1000 ? num(Math.round(d)) + " m" : num(d / 1000, 1) + " km"} hacia el ${RUM[Math.round(b / 45) % 8]}`;
  } catch (e) { pd = geoErr(e); }
  busy = false; renderPark();
}
async function liberar() {
  if (!confirm("¿Ya has recogido el coche? Se borrará la ubicación guardada.")) return;
  const nube = await putPark({ libre: true }); toast(nube ? "Ubicación borrada" : "Ubicación borrada en este móvil");
}
function compartir() {
  const v = pkVal(); if (!v) return;
  const gps = v.lat != null, u = gps ? `https://www.google.com/maps/search/?api=1&query=${v.lat},${v.lng}` : undefined;
  navigator.share({ title: "Dónde he aparcado", text: `Coche aparcado${v.nota ? ": " + v.nota : ""}`, ...(u ? { url: u } : {}) }).catch(() => {});
}

// hoja para anotar (y/o añadir GPS)
function openPark() {
  const v = pkVal();
  pk = { nota: v?.nota || "", lat: v?.lat ?? null, lng: v?.lng ?? null, acc: v?.acc ?? null, ts: v?.ts || null, est: "", msg: "" };
  drawPark(); $("#sheet").classList.add("open");
}
function drawPark() {
  const g = pk.lat != null;
  $("#pan").innerHTML = `${hd("Aparqué aquí")}
    <section class="blk m"><h3>Ubicación GPS</h3>
      <div class="empty">${g ? `✔ ${num(pk.lat, 5)}, ${num(pk.lng, 5)} · precisión ±${num(pk.acc || 0)} m` : esc(pk.msg || "Sin GPS todavía (opcional).")}</div>
      ${g && pk.acc > 50 ? `<span class="lb">Precisión baja (¿garaje o interior?). Mejor añade la planta o la plaza en la nota.</span>` : ""}
      <div class="bt" style="margin:10px 0 0"><button class="btn" id="pgps">${pk.est === "busca" ? "Buscando…" : g ? "Actualizar GPS" : "Usar mi GPS"}</button>${g ? `<button class="btn" id="pnogps" style="background:var(--mu)">Quitar GPS</button>` : ""}</div></section>
    <section class="blk m"><h3>Nota</h3>
      <input data-p="nota" placeholder="p. ej. Planta -2, plaza 45 · Calle Mayor 12" value="${esc(pk.nota)}">
      <span class="lb">Sirve sola o junto al GPS. Útil en garajes, donde el GPS falla.</span></section>
    <div class="acts"><button id="cancel">Cancelar</button><button class="btn" id="savep">Guardar</button></div>`;
}
async function pkGps() {
  if (!pk || pk.est === "busca") return;
  pk.est = "busca"; pk.msg = "Buscando señal GPS…"; drawPark();
  try { const c = await getPos(); Object.assign(pk, { lat: +c.latitude.toFixed(6), lng: +c.longitude.toFixed(6), acc: Math.round(c.accuracy), ts: Date.now(), est: "ok", msg: "" }); }
  catch (e) { pk.est = "err"; pk.msg = geoErr(e); }
  if ($("#pan").querySelector("#pgps")) drawPark();
}
async function savePk() {
  const nota = (pk.nota || "").trim();
  if (pk.lat == null && !nota) return toast("Añade el GPS o escribe una nota");
  const v = { ts: pk.ts || Date.now(), nota };
  if (pk.lat != null) { v.lat = pk.lat; v.lng = pk.lng; v.acc = pk.acc || 0; }
  closeSheet(); const nube = await putPark(v); okMsg(nube, "Guardado");
}
$("#park").onclick = e => {
  const id = e.target.closest("button")?.id;
  if (id === "pk-gps" || id === "pk-new") guardarGps(false);
  else if (id === "pk-addgps") guardarGps(true);
  else if (id === "pk-note" || id === "pk-edit") openPark();
  else if (id === "pk-dist") distancia();
  else if (id === "pk-share") compartir();
  else if (id === "pk-free") liberar();
};

// ---------- eventos ----------
$("#resumen").onclick = openResumen;
$("#mant").onclick = e => { const go = e.target.closest("[data-go]"); if (go) { sel = +go.dataset.go; const d = new Date(sel * 1000); view = new Date(d.getFullYear(), d.getMonth(), 1); render(); openSheet(); return; } const i = e.target.id; if (i === "tw") openTaller(); else if (i === "lv") openForm("lavado"); else if (i === "vi") openForm("vineta"); else if (i === "it") openForm("itv"); else if (i === "ac") openForm("aceite"); };
$("#cal").onclick = e => {
  const b = e.target.closest(".d"); if (!b) return;
  sel = +b.dataset.ts;
  const d = new Date(sel * 1000);
  if (d.getMonth() !== view.getMonth()) view = new Date(d.getFullYear(), d.getMonth(), 1);
  render();
};
$("#prev").onclick = () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); render(); };
$("#next").onclick = () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); render(); };
$("#mes").onclick = () => { sel = dayTs(new Date()); view = new Date(); view.setDate(1); render(); };
$("#login").onclick = () => !auth ? toast("Sin conexión a Firebase") : signInWithPopup(auth, new GoogleAuthProvider()).then(() => toast("Sesión iniciada")).catch(e => toast("No se pudo iniciar sesión (" + (e.code || e.message) + ")"));
$("#day").onclick = e => { if (e.target.id === "edit") openSheet(); };
$("#sheet").onclick = e => { if (e.target.id === "sheet") closeSheet(); };

const pan = $("#pan");
pan.oninput = e => {
  const t = e.target;
  if (t.dataset.p) { pk[t.dataset.p] = t.value; return; }
  if (t.dataset.f) { fm[t.dataset.f] = t.value; return; }
  if (t.dataset.w) { tw[t.dataset.w] = t.type === "checkbox" ? t.checked : t.value; return; }
  if (t.dataset.k === "a") dr.a = t.value;
  else if (t.dataset.k === "g" && !t.dataset.a) dr.g = t.value;
  else if (t.dataset.a) dr[t.dataset.a][t.dataset.i][t.dataset.k] = t.type === "checkbox" ? t.checked : t.value;
  if (t.dataset.a === "t" && t.dataset.k === "km" && dr.t[t.dataset.i]?.est) { delete dr.t[t.dataset.i].est; pan.querySelector(`[data-estb="${t.dataset.i}"]`)?.remove(); }
};
pan.onchange = e => { if (e.target.dataset.w === "motivo") { tw.motivo = e.target.value; if (tw.motivo === "ITV" && !tw.proxima) tw.proxima = addYear(itv()?.f || tw.fecha); drawTaller(); } if (e.target.id === "gOn") { dr.g = e.target.checked ? "" : null; drawSheet(); } };
pan.onclick = e => {
  const t = e.target;
  if (t.dataset.add) { dr[t.dataset.add].push({ km: "", coment: "", litros: "", euros: "", lleno: true }); drawSheet(); }
  else if (t.dataset.q != null) { const q = quick()[+t.dataset.q], base = Math.max(kmAt(sel), maxKm(dr.t)); dr.t.push({ km: q.d ? String(Math.round(base + q.d)) : "", coment: q.label, est: !!q.d }); drawSheet(); }
  else if (t.dataset.del) { dr[t.dataset.del].splice(+t.dataset.i, 1); drawSheet(); }
  else if (t.id === "save") save();
  else if (t.id === "savew") saveW();
  else if (t.id === "savef") saveF();
  else if (t.id === "pgps") pkGps();
  else if (t.id === "pnogps") { pk.lat = pk.lng = pk.acc = null; pk.ts = null; pk.est = ""; drawPark(); }
  else if (t.id === "savep") savePk();
  else if (t.id === "cancel") closeSheet();
};

// ---------- modo noche ----------
// De noche = el sol está por debajo del horizonte en Madrid (se calcula con la fecha y la hora, así cambia solo con las estaciones).
// Para probar: añade ?tema=noche o ?tema=dia a la dirección.
function esNoche(d = new Date()) {
  const q = new URLSearchParams(location.search).get("tema"); if (q === "noche") return true; if (q === "dia") return false;
  const R = Math.PI / 180, lat = 40.4 * R, lon = -3.7;
  const n = Math.floor((d - Date.UTC(d.getUTCFullYear(), 0, 0)) / 864e5), h = d.getUTCHours() + d.getUTCMinutes() / 60;
  const g = 2 * Math.PI / 365 * (n - 1 + (h - 12) / 24);
  const dec = .006918 - .399912 * Math.cos(g) + .070257 * Math.sin(g) - .006758 * Math.cos(2 * g) + .000907 * Math.sin(2 * g) - .002697 * Math.cos(3 * g) + .00148 * Math.sin(3 * g);
  const eqt = 229.18 * (.000075 + .001868 * Math.cos(g) - .032077 * Math.sin(g) - .014615 * Math.cos(2 * g) - .040849 * Math.sin(2 * g));
  const ha = ((h * 60 + eqt + 4 * lon) / 4 - 180) * R;
  const el = Math.asin(Math.sin(lat) * Math.sin(dec) + Math.cos(lat) * Math.cos(dec) * Math.cos(ha)) / R;
  return el < -3;
}
function applyTheme() {
  const n = esNoche(); if (n === noche && document.body.classList.contains("night") === n) return;
  noche = n; document.body.classList.toggle("night", n);
  document.querySelector('meta[name="theme-color"]').content = n ? "#09120d" : "#1f3f1b";
  renderCar();
}
setInterval(applyTheme, 60000); document.addEventListener("visibilitychange", () => { if (!document.hidden) applyTheme(); });

// escucha en tiempo real la misma base de datos de siempre
// primero se pinta siempre (con datos de ejemplo); si Firebase conecta, se sustituyen por los reales
D = DEMO;
sel = Math.max(...Object.keys(DEMO.Trayectos).map(Number));
view = new Date(sel * 1000); view.setDate(1);
applyTheme();
render();
setTimeout(() => { if (!db && !$("#estado").textContent) estado(false, "Modo demostración: Firebase no responde (¿sin internet o bloqueado?)"); }, 8000);
try {
  if (SIN_FIREBASE) throw new Error("falta configurar Firebase, ver README");
  const U = "https://www.gstatic.com/firebasejs/10.9.0/";
  const [A, B, C] = await Promise.all([import(U + "firebase-app.js"), import(U + "firebase-database.js"), import(U + "firebase-auth.js")]);
  const app = A.initializeApp(CFG);
  ({ ref, set, remove } = B); ({ signInWithPopup, GoogleAuthProvider } = C);
  auth = C.getAuth(app);
  const d = B.getDatabase(app);
  let off = null;
  const listen = () => {
    if (off) off();                    // cancela la suscripción anterior (p. ej. rechazada por permisos)
    off = B.onValue(B.ref(d), snap => {
      D = snap.val() || {};
      if (!db) { sel = dayTs(new Date()); view = new Date(); view.setDate(1); }
      db = d;
      const t = ["Trayectos", "Recargas", "Guardias"].flatMap(n => Object.keys(D[n] || {}).map(Number));
      estado(true, `Conectado a Firebase · ${t.length} registros · último dato: ${t.length ? fmt(Math.max(...t), { day: "numeric", month: "long", year: "numeric" }) : "ninguno"}`);
      render();
    }, err => { db = null; D = DEMO; render(); estado(false, `Modo demostración: sin acceso a la base de datos (${err.code || err.message}).`); });
  };
  C.onAuthStateChanged(auth, u => { usr = u?.email || ""; listen(); });
} catch (e) { estado(false, `Modo demostración: no se pudo cargar Firebase (${e.message})`); }
// atajo del icono (manifest "shortcuts"): ?accion=aparcar guarda el GPS nada más abrir
if (new URLSearchParams(location.search).get("accion") === "aparcar") { history.replaceState(null, "", location.pathname); guardarGps(false); }
